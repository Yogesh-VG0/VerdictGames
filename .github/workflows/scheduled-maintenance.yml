name: Scheduled maintenance

on:
  schedule:
    # GitHub cron is UTC. Off-hour minutes reduce scheduler delays.
    # Restore essential freshness first. Other jobs remain available for manual dispatch.
    - cron: "17 0,12 * * *" # Steam players and trending, twice daily
    - cron: "37 3 * * *" # Essential discovery, daily
    - cron: "47 6 * * *" # Recent release and stale metadata refresh, daily
    # These additional schedules have separate opt-in gates after capacity trials.
    - cron: "13 1-11,13-23 * * *" # Player observations between Trending runs
    - cron: "43 4 * * 1,4" # Steam review excerpts, twice weekly
    - cron: "23 2 * * 6" # Curated lists, weekly
    - cron: "29 5 * * 2" # Android verification, weekly
    - cron: "29 5 * * 5" # iOS verification, weekly
    - cron: "53 2,8,14,20 * * *" # Independent upcoming snapshots
    - cron: "23 6,18 * * *" # Additional Trending passes, staggered from player observations
    - cron: "47 13 * * *" # Second bounded enrichment cohort
    - cron: "57 9 * * *" # Missing Steam chart games
    - cron: "53 4 * * 3" # Incremental deep discovery
    - cron: "51 4 * * 0" # Checkpointed historical backfill
    - cron: "9 7 * * *" # Freshness and failure summary
  workflow_dispatch:
    inputs:
      mode:
        description: Operator dispatch or approved external UTC slot
        type: choice
        default: manual
        options:
          - manual
          - external_cron
      scheduled_slot_utc:
        description: Exact UTC slot for the dedicated external scheduler
        type: string
        required: false
      job:
        description: Maintenance job to run for operator dispatch
        required: false
        type: choice
        default: automatic-slot
        options:
          - automatic-slot
          - refresh-trending
          - refresh-player-counts
          - refresh-upcoming-snapshot
          - discover-steam-popular
          - maintenance-health
          - refresh-steam-reviews
          - re-enrich
          - seed-curated-lists
          - discover-standard
          - discover-deep
          - backfill-games
          - backfill-mobile-android
          - backfill-mobile-ios
      review_limit:
        description: Maximum Steam review caches to refresh (1–25)
        required: false
        default: "25"
        type: string

permissions:
  contents: read

jobs:
  resolve:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (vars.CATALOGUE_CRON_ENABLED == 'true' &&
      (github.event.schedule != '13 1-11,13-23 * * *' || vars.CATALOGUE_PLAYER_CRON_ENABLED == 'true') &&
      (github.event.schedule != '43 4 * * 1,4' || vars.CATALOGUE_REVIEW_CRON_ENABLED == 'true') &&
      (github.event.schedule != '23 2 * * 6' || vars.CATALOGUE_CURATED_CRON_ENABLED == 'true') &&
      (!contains(fromJSON('["29 5 * * 2","29 5 * * 5"]'), github.event.schedule) ||
      vars.CATALOGUE_MOBILE_CRON_ENABLED == 'true') &&
      (github.event.schedule != '53 2,8,14,20 * * *' || vars.CATALOGUE_UPCOMING_CRON_ENABLED == 'true') &&
      (!contains(fromJSON('["23 6,18 * * *","47 13 * * *","57 9 * * *","53 4 * * 3","51 4 * * 0","9 7 * * *"]'), github.event.schedule) ||
      vars.CATALOGUE_FOLLOWUP_CRON_ENABLED == 'true')))
    name: Resolve maintenance ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      job: ${{ steps.resolve.outputs.job }}
      slot: ${{ steps.resolve.outputs.slot }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve and authorize job
        id: resolve
        env:
          MAINTENANCE_GITHUB_TOKEN: ${{ github.token }}
          CATALOGUE_EXTERNAL_CRON_ACTOR_ID: ${{ vars.CATALOGUE_EXTERNAL_CRON_ACTOR_ID }}
          CATALOGUE_EXTERNAL_CRON_PLAN: ${{ vars.CATALOGUE_EXTERNAL_CRON_PLAN }}
          CATALOGUE_MANUAL_OPERATOR_IDS: ${{ vars.CATALOGUE_MANUAL_OPERATOR_IDS }}
          CATALOGUE_CRON_ENABLED: ${{ vars.CATALOGUE_CRON_ENABLED }}
          CATALOGUE_PLAYER_CRON_ENABLED: ${{ vars.CATALOGUE_PLAYER_CRON_ENABLED }}
          CATALOGUE_REVIEW_CRON_ENABLED: ${{ vars.CATALOGUE_REVIEW_CRON_ENABLED }}
          CATALOGUE_CURATED_CRON_ENABLED: ${{ vars.CATALOGUE_CURATED_CRON_ENABLED }}
          CATALOGUE_MOBILE_CRON_ENABLED: ${{ vars.CATALOGUE_MOBILE_CRON_ENABLED }}
          CATALOGUE_UPCOMING_CRON_ENABLED: ${{ vars.CATALOGUE_UPCOMING_CRON_ENABLED }}
          CATALOGUE_FOLLOWUP_CRON_ENABLED: ${{ vars.CATALOGUE_FOLLOWUP_CRON_ENABLED }}
        run: node ops/maintenance-cron/resolve.mjs

  run:
    needs: resolve
    if: needs.resolve.outputs.job != ''
    concurrency:
      # Only admitted jobs can enter the single maintenance queue.
      group: scheduled-maintenance
      queue: max
      cancel-in-progress: false
    name: ${{ needs.resolve.outputs.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Check slot before database access
        id: lease
        env:
          AUTOMATIC_SLOT: ${{ needs.resolve.outputs.slot }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { isFreshSlot } from './ops/maintenance-cron/slots.mjs';
          const slot = process.env.AUTOMATIC_SLOT;
          const fresh = !slot || isFreshSlot(slot);
          appendFileSync(process.env.GITHUB_OUTPUT, "fresh=" + fresh + "\n");
          if (!fresh) appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Maintenance slot expired before database access.\n");
          JS

      - name: Validate required secrets
        if: steps.lease.outputs.fresh == 'true'
        shell: bash
        env:
          JOB: ${{ needs.resolve.outputs.job }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/check-maintenance-config.mjs

      - name: Install production dependencies
        if: steps.lease.outputs.fresh == 'true'
        run: npm ci --omit=dev --ignore-scripts

      - name: Check database pressure
        if: steps.lease.outputs.fresh == 'true'
        id: pressure
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SCHEDULER_DB_MAX_CONNECTIONS: "1"
          SCHEDULER_DB_CONNECT_TIMEOUT_SECONDS: "5"
        run: node scripts/check-maintenance-pressure.mjs "${{ needs.resolve.outputs.job }}"

      - name: Claim automatic UTC slot
        id: slot
        if: steps.pressure.outputs.run_job == 'true' && needs.resolve.outputs.slot != ''
        env:
          AUTOMATIC_JOB: ${{ needs.resolve.outputs.job }}
          AUTOMATIC_SLOT: ${{ needs.resolve.outputs.slot }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SCHEDULER_DB_MAX_CONNECTIONS: "1"
          SCHEDULER_DB_CONNECT_TIMEOUT_SECONDS: "5"
        run: node ops/maintenance-cron/claim.mjs

      - name: Check RAWG availability
        id: rawg_health
        if: steps.pressure.outputs.run_job == 'true' && (needs.resolve.outputs.slot == '' || steps.slot.outputs.claimed == 'true')
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/check-rawg-availability.mjs "${{ needs.resolve.outputs.job }}"

      - name: Restore backfill checkpoint
        if: needs.resolve.outputs.job == 'backfill-games' && steps.rawg_health.outputs.run_job == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .backfill-checkpoint.json
          key: game-backfill-${{ github.run_id }}
          restore-keys: |
            game-backfill-

      - name: Run maintenance job
        if: steps.rawg_health.outputs.run_job == 'true'
        shell: bash
        env:
          JOB: ${{ needs.resolve.outputs.job }}
          DISCOVERY_PROVIDER: ${{ steps.rawg_health.outputs.discovery_provider }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_REVIEW_LIMIT: ${{ inputs.review_limit || '25' }}
          DISCOVERY_REFRESH_UPCOMING: ${{ vars.CATALOGUE_UPCOMING_CRON_ENABLED != 'true' }}
          CATALOGUE_UPCOMING_CRON_ENABLED: ${{ vars.CATALOGUE_UPCOMING_CRON_ENABLED }}
          CATALOGUE_BUDGET_JOB: ${{ needs.resolve.outputs.job }}
          CATALOGUE_PLAYER_CRON_ENABLED: ${{ vars.CATALOGUE_PLAYER_CRON_ENABLED }}
          CATALOGUE_REVIEW_CRON_ENABLED: ${{ vars.CATALOGUE_REVIEW_CRON_ENABLED }}
          CATALOGUE_CURATED_CRON_ENABLED: ${{ vars.CATALOGUE_CURATED_CRON_ENABLED }}
          CATALOGUE_MOBILE_CRON_ENABLED: ${{ vars.CATALOGUE_MOBILE_CRON_ENABLED }}
          SCHEDULER_DB_MAX_CONNECTIONS: "2"
          SCHEDULER_DB_CONNECT_TIMEOUT_SECONDS: "30"
          SCHEDULER_DB_IDLE_TIMEOUT_SECONDS: "30"
          # One connection remains available while the session advisory lock is held.
          SCHEDULER_INGEST_CONCURRENCY: "1"
        run: |
          export NODE_OPTIONS="--import=./scripts/lib/maintenance-provider-budget.mjs"
          case "$JOB" in
            refresh-trending) node scripts/heroku-refresh-trending.mjs ;;
            refresh-player-counts) node scripts/heroku-refresh-trending.mjs --players-only ;;
            refresh-upcoming-snapshot) node scripts/catalogue-discovery-maintenance.mjs upcoming ;;
            maintenance-health) node scripts/maintenance-health.mjs ;;
            refresh-steam-reviews) node scripts/refresh-steam-reviews.mjs ;;
            re-enrich) node scripts/heroku-re-enrich.mjs --limit 10 ;;
            seed-curated-lists) node scripts/seed-curated-lists.mjs ;;
            discover-standard) node scripts/heroku-discover-games.mjs --essential ;;
            discover-steam-popular) node scripts/catalogue-discovery-maintenance.mjs popular ;;
            discover-deep) node scripts/catalogue-discovery-maintenance.mjs deep ;;
            backfill-games) node scripts/backfill-games.mjs --limit=4 --pages=2 ;;
            backfill-mobile-android) node scripts/backfill-mobile-listings.mjs --android-only --limit=25 ;;
            backfill-mobile-ios) node scripts/backfill-mobile-listings.mjs --ios-only --limit=25 ;;
            *) echo "::error::Unknown job: $JOB"; exit 1 ;;
          esac
