name: Scheduled maintenance

on:
  schedule:
    # GitHub cron is UTC. Off-hour minutes reduce scheduler delays.
    # Restore essential freshness first. Other jobs remain available for manual dispatch.
    - cron: "17 0,12 * * *" # Steam players and trending, twice daily
    - cron: "37 3 * * *" # Essential discovery, daily
    - cron: "47 6 * * *" # Recent release and stale metadata refresh, daily
    # These additional schedules have separate opt-in gates after capacity trials.
    - cron: "13 1-11,13-23 * * *" # Player observations between Trending runs
    - cron: "43 4 * * 1,4" # Steam review excerpts, twice weekly
    - cron: "23 2 * * 6" # Curated lists, weekly
    - cron: "29 5 * * 2" # Android verification, weekly
    - cron: "29 5 * * 5" # iOS verification, weekly
  workflow_dispatch:
    inputs:
      job:
        description: Maintenance job to run
        required: true
        type: choice
        options:
          - refresh-trending
          - refresh-player-counts
          - refresh-steam-reviews
          - re-enrich
          - seed-curated-lists
          - discover-standard
          - discover-deep
          - backfill-games
          - backfill-mobile-android
          - backfill-mobile-ios
      review_limit:
        description: Maximum Steam review caches to refresh (1–1000)
        required: false
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  run:
    # Let explicitly approved manual trials run before recurring work is enabled.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.CATALOGUE_CRON_ENABLED == 'true' &&
      (github.event.schedule != '13 1-11,13-23 * * *' || vars.CATALOGUE_PLAYER_CRON_ENABLED == 'true') &&
      (github.event.schedule != '43 4 * * 1,4' || vars.CATALOGUE_REVIEW_CRON_ENABLED == 'true') &&
      (github.event.schedule != '23 2 * * 6' || vars.CATALOGUE_CURATED_CRON_ENABLED == 'true') &&
      (!contains(fromJSON('["29 5 * * 2","29 5 * * 5"]'), github.event.schedule) ||
      vars.CATALOGUE_MOBILE_CRON_ENABLED == 'true'))
    concurrency:
      # A single worker prevents different jobs competing for the free database.
      group: scheduled-maintenance
      cancel-in-progress: false
    name: ${{ inputs.job || 'Scheduled job' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve job
        id: resolve
        shell: bash
        env:
          MANUAL_JOB: ${{ inputs.job }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ -n "$MANUAL_JOB" ]]; then
            job="$MANUAL_JOB"
          else
            case "$SCHEDULE" in
              "17 0,12 * * *") job="refresh-trending" ;;
              "37 3 * * *") job="discover-standard" ;;
              "47 6 * * *") job="re-enrich" ;;
              "13 1-11,13-23 * * *") job="refresh-player-counts" ;;
              "43 4 * * 1,4") job="refresh-steam-reviews" ;;
              "23 2 * * 6") job="seed-curated-lists" ;;
              "29 5 * * 2") job="backfill-mobile-android" ;;
              "29 5 * * 5") job="backfill-mobile-ios" ;;
              *) echo "::error::Unknown schedule: $SCHEDULE"; exit 1 ;;
            esac
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "### Running \`$job\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Validate required secrets
        shell: bash
        env:
          JOB: ${{ steps.resolve.outputs.job }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/check-maintenance-config.mjs

      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Check RAWG availability
        id: rawg_health
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/check-rawg-availability.mjs "${{ steps.resolve.outputs.job }}"

      - name: Restore backfill checkpoint
        if: steps.resolve.outputs.job == 'backfill-games' && steps.rawg_health.outputs.run_job == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .backfill-checkpoint.json
          key: game-backfill-${{ github.run_id }}
          restore-keys: |
            game-backfill-

      - name: Run maintenance job
        if: steps.rawg_health.outputs.run_job == 'true'
        shell: bash
        env:
          JOB: ${{ steps.resolve.outputs.job }}
          DISCOVERY_PROVIDER: ${{ steps.rawg_health.outputs.discovery_provider }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_REVIEW_LIMIT: ${{ inputs.review_limit || '25' }}
          SCHEDULER_DB_MAX_CONNECTIONS: "2"
          SCHEDULER_DB_CONNECT_TIMEOUT_SECONDS: "30"
          SCHEDULER_DB_IDLE_TIMEOUT_SECONDS: "30"
          # One connection remains available while the session advisory lock is held.
          SCHEDULER_INGEST_CONCURRENCY: "1"
        run: |
          case "$JOB" in
            refresh-trending) node scripts/heroku-refresh-trending.mjs ;;
            refresh-player-counts) node scripts/heroku-refresh-trending.mjs --players-only ;;
            refresh-steam-reviews) node scripts/refresh-steam-reviews.mjs ;;
            re-enrich) node scripts/heroku-re-enrich.mjs --limit 10 ;;
            seed-curated-lists) node scripts/seed-curated-lists.mjs ;;
            discover-standard) node scripts/heroku-discover-games.mjs --essential ;;
            discover-deep) node scripts/heroku-discover-games.mjs --deep ;;
            backfill-games) node scripts/backfill-games.mjs ;;
            backfill-mobile-android) node scripts/backfill-mobile-listings.mjs --android-only --limit=25 ;;
            backfill-mobile-ios) node scripts/backfill-mobile-listings.mjs --ios-only --limit=25 ;;
            *) echo "::error::Unknown job: $JOB"; exit 1 ;;
          esac
