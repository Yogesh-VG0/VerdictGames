name: Scheduled maintenance

on:
  schedule:
    # GitHub cron is UTC. Off-hour minutes reduce scheduler delays.
    - cron: "17 0,6,12,18 * * *" # Steam players and trending, every 6 hours
    - cron: "47 1,13 * * *" # Re-enrich stale games, twice daily
    - cron: "23 2 * * *" # Curated lists, daily
    - cron: "37 3 * * *" # Standard discovery, daily
    - cron: "53 4 * * *" # Historical backfill, daily
    - cron: "29 5 * * 2" # Android listing verification, weekly
    - cron: "29 5 * * 5" # iOS listing verification, weekly
    - cron: "11 15 * * 0" # Deep discovery, weekly and >5h after standard can finish
  workflow_dispatch:
    inputs:
      job:
        description: Maintenance job to run
        required: true
        type: choice
        options:
          - refresh-trending
          - re-enrich
          - seed-curated-lists
          - discover-standard
          - discover-deep
          - backfill-games
          - backfill-mobile-android
          - backfill-mobile-ios

permissions:
  contents: read

concurrency:
  group: scheduled-maintenance-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.job || 'Scheduled job' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Resolve job
        id: resolve
        shell: bash
        env:
          MANUAL_JOB: ${{ inputs.job }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ -n "$MANUAL_JOB" ]]; then
            job="$MANUAL_JOB"
          else
            case "$SCHEDULE" in
              "17 0,6,12,18 * * *") job="refresh-trending" ;;
              "47 1,13 * * *") job="re-enrich" ;;
              "23 2 * * *") job="seed-curated-lists" ;;
              "37 3 * * *") job="discover-standard" ;;
              "53 4 * * *") job="backfill-games" ;;
              "29 5 * * 2") job="backfill-mobile-android" ;;
              "29 5 * * 5") job="backfill-mobile-ios" ;;
              "11 15 * * 0") job="discover-deep" ;;
              *) echo "::error::Unknown schedule: $SCHEDULE"; exit 1 ;;
            esac
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "### Running \`$job\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Validate required secrets
        shell: bash
        env:
          JOB: ${{ steps.resolve.outputs.job }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          missing=()
          [[ -z "$SUPABASE_DB_URL" ]] && missing+=(SUPABASE_DB_URL)
          case "$JOB" in
            refresh-trending|re-enrich|discover-standard|discover-deep|backfill-games)
              [[ -z "$RAWG_API_KEY" ]] && missing+=(RAWG_API_KEY)
              ;;
          esac
          if (( ${#missing[@]} )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Check RAWG availability
        id: rawg_health
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: node scripts/check-rawg-availability.mjs "${{ steps.resolve.outputs.job }}"

      - name: Restore backfill checkpoint
        if: steps.resolve.outputs.job == 'backfill-games' && steps.rawg_health.outputs.run_job == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .backfill-checkpoint.json
          key: game-backfill-${{ github.run_id }}
          restore-keys: |
            game-backfill-

      - name: Install production dependencies
        if: steps.rawg_health.outputs.run_job == 'true'
        run: npm ci --omit=dev --ignore-scripts

      - name: Run maintenance job
        if: steps.rawg_health.outputs.run_job == 'true'
        shell: bash
        env:
          JOB: ${{ steps.resolve.outputs.job }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          SCHEDULER_DB_MAX_CONNECTIONS: "2"
          SCHEDULER_DB_CONNECT_TIMEOUT_SECONDS: "30"
          SCHEDULER_DB_IDLE_TIMEOUT_SECONDS: "30"
        run: |
          case "$JOB" in
            refresh-trending) node scripts/heroku-refresh-trending.mjs ;;
            re-enrich) node scripts/heroku-re-enrich.mjs ;;
            seed-curated-lists) node scripts/seed-curated-lists.mjs ;;
            discover-standard) node scripts/heroku-discover-games.mjs ;;
            discover-deep) node scripts/heroku-discover-games.mjs --deep ;;
            backfill-games) node scripts/backfill-games.mjs ;;
            backfill-mobile-android) node scripts/backfill-mobile-listings.mjs --android-only ;;
            backfill-mobile-ios) node scripts/backfill-mobile-listings.mjs --ios-only ;;
            *) echo "::error::Unknown job: $JOB"; exit 1 ;;
          esac
